const config=JSON.parse(document.getElementById("mibbi-shell-config").textContent),frame=document.getElementById("mibbi-website"),key="mibbi-customer:"+config.scope;
let session=null;
function valid(s){return s===null||(s&&typeof s.access_token==="string"&&s.access_token.length<=8000&&typeof s.refresh_token==="string"&&s.refresh_token.length<=8000&&s.user&&typeof s.user.id==="string"&&/^[0-9a-f-]{36}$/.test(s.user.id));}
try{const cached=JSON.parse(sessionStorage.getItem(key)||"null");if(valid(cached))session=cached;}catch{}
window.addEventListener("message",event=>{
 if(event.source!==frame.contentWindow||event.data?.scope!==config.scope)return;
 if(event.data.type==="mibbi-database-session:get")frame.contentWindow.postMessage({type:"mibbi-database-session:restore",scope:config.scope,session},"*");
 if(event.data.type==="mibbi-database-session:set"&&valid(event.data.session)){session=event.data.session;try{if(session)sessionStorage.setItem(key,JSON.stringify(session));else sessionStorage.removeItem(key);}catch{}}
 if(event.data.type==="mibbi-database-download"){
  const d=event.data,types={jpg:"image/jpeg",png:"image/png",webp:"image/webp",pdf:"application/pdf"};
  if(!session||!(d.bytes instanceof ArrayBuffer)||!d.bytes.byteLength||d.bytes.byteLength>5242880||typeof d.name!=="string"||!/^[0-9a-f-]{36}\.(jpg|png|webp|pdf)$/.test(d.name)||types[d.name.split(".").pop()]!==d.mime)return;
  const bytes=new Uint8Array(d.bytes);let encoded="";for(let offset=0;offset<bytes.length;offset+=16384)encoded+=String.fromCharCode(...bytes.subarray(offset,offset+16384));const link=document.createElement("a");link.href="data:"+d.mime+";base64,"+btoa(encoded);link.download=d.name;link.rel="noopener";const panel=document.createElement("dialog"),title=document.createElement("p"),close=document.createElement("button");title.textContent="Your file is ready.";link.textContent="Save file";close.textContent="Close";close.type="button";const cleanup=()=>{panel.remove();};close.onclick=cleanup;panel.appendChild(title);panel.appendChild(link);panel.appendChild(close);document.body.appendChild(panel);panel.showModal();setTimeout(cleanup,120000);
 }
 if(event.data.type==="mibbi-database-page"){
  const target=config.pages.find(p=>p.slug===event.data.slug);if(!target)return;
  const hash=typeof event.data.hash==="string"&&/^#[A-Za-z0-9_.:-]{0,100}$/.test(event.data.hash)?event.data.hash:"";

 }
});
