<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer database acceptance</title><meta name="description" content="Disposable live provider checks"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-xrJqiswoSHvEsqizstiUHoB3Q0d6T5Q0IiXakVlm8Eo='; style-src 'unsafe-inline'; frame-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="mibbi-website" title="Customer database acceptance" src="pages/records.html?runtime=70e6356" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe><script id="mibbi-shell-config" type="application/json">{"scope":"mb_4be82b6abf534739964887b84f1f5bc8:oveqrtyaquwgtkverrnl","pages":[{"slug":"home","href":"./index.html"},{"slug":"records","href":"./records.html"}]}</script><script>(()=>{
const config=JSON.parse(document.getElementById("mibbi-shell-config").textContent),frame=document.getElementById("mibbi-website"),key="mibbi-customer:"+config.scope;
let session=null;
function valid(s){return s===null||(s&&typeof s.access_token==="string"&&s.access_token.length<=8000&&typeof s.refresh_token==="string"&&s.refresh_token.length<=8000&&s.user&&typeof s.user.id==="string"&&/^[0-9a-f-]{36}$/.test(s.user.id));}
try{const cached=JSON.parse(sessionStorage.getItem(key)||"null");if(valid(cached))session=cached;}catch{}
window.addEventListener("message",event=>{
 if(event.source!==frame.contentWindow||event.data?.scope!==config.scope)return;
 if(event.data.type==="mibbi-database-session:get")frame.contentWindow.postMessage({type:"mibbi-database-session:restore",scope:config.scope,session},"*");
 if(event.data.type==="mibbi-database-session:set"&&valid(event.data.session)){session=event.data.session;try{if(session)sessionStorage.setItem(key,JSON.stringify(session));else sessionStorage.removeItem(key);}catch{}}
 if(event.data.type==="mibbi-database-page"){
  const target=config.pages.find(p=>p.slug===event.data.slug);if(!target)return;
  const hash=typeof event.data.hash==="string"&&/^#[A-Za-z0-9_.:-]{0,100}$/.test(event.data.hash)?event.data.hash:"";
  location.assign(target.href+hash);
 }
});
})();</script><noscript>Enable JavaScript to use this website’s customer accounts and database features.</noscript></body></html>
